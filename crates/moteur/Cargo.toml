[package]
name = "plumeo-moteur"
version.workspace = true
edition.workspace = true

[features]
fixtures = ["dep:tempfile"]

[[test]]
name = "lecture"
required-features = ["fixtures"]

[[test]]
name = "conversion"
required-features = ["fixtures"]

[dependencies]
pdfium-render = { version = "0.9.5", default-features = false, features = ["pdfium_8125", "thread_safe", "image_latest"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
serde_json = "1"
regex = "1"
unicode-normalization = "0.1"
image = { version = "0.25", default-features = false, features = ["png"] }
tempfile = { version = "3", optional = true }

[dev-dependencies]
tempfile = "3"
plumeo-epub = { path = "../epub" }
